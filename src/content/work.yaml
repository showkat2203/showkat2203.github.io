# Selected work, ordered by `order`. Distributed systems and machine learning
# lead; embedded follows. Keep `body` to two sentences: the card carries a
# diagram and the figures, so the prose only has to frame the problem.
#
#   diagram: timing | reconcile | graph | pipeline   (src/components/diagrams/)
#   tags:    the stack, shown as small mono chips
#   metrics: evidence, shown as figures beneath the text

mcu-timing:
  order: 4
  title: Sensor streaming that cannot miss a 15 ms deadline
  org: Samsung Research, wearable platform
  period: 2018 – 2021
  diagram: timing
  tags: [C, C++, FreeRTOS, BLE, GATT, JTAG]
  body: >-
    Heart-rate, stress, and sleep tracking across more than 90 exercise modes,
    on a microcontroller whose memory and power budgets were fixed before the
    work started. Races and timing defects at that level leave nothing in a log,
    so they were found on the running instruction stream with JTAG and Trace32.
  metrics:
    - value: 15 ms
      label: streaming cadence held
    - value: 2M+
      label: devices shipped, no known production defects
    - value: 99%
      label: rollback-safe update success, zero bricked devices

reconciliation:
  order: 1
  title: Reconciling an event stream that drops, duplicates, and reorders
  org: Amazon Web Services, infrastructure supply chain
  period: 2025 – 2026
  diagram: reconcile
  tags: [Java, Spring Boot, EventBridge, SQS, AWS Batch, DynamoDB]
  body: >-
    The hardware system of record carried a 24-hour consistency commitment while
    taking asynchronous updates from more than fifteen cross-region systems. An
    event-driven reconciliation service detected divergence and replayed it
    safely, so the commitment was something the system held rather than
    something the design asserted.
  metrics:
    - value: 24 h
      label: consistency commitment, held
    - value: 15+
      label: cross-region systems integrated
    - value: 60% → 90%
      label: integration test coverage

change-impact-graph:
  order: 2
  title: Change impact as a graph traversal, not a lookup
  org: Amazon Web Services, infrastructure supply chain
  period: 2025 – 2026
  diagram: graph
  tags: [Amazon Neptune, DynamoDB, GraphQL, React, TypeScript]
  body: >-
    Millions of hardware components, assemblies, and bills of material modelled
    as a graph, so that asking what a change breaks could be answered across
    products, sites, and programs before the change shipped. A rules engine
    evaluated site, region, and program policy from declarative configuration.
  metrics:
    - value: 60%
      label: gain in hardware qualification efficiency
    - value: 100+
      label: manufacturing sites onboarded without per-class code

emr-pipelines:
  order: 3
  title: Feature extraction across ten million transactions
  org: Baylor University, graduate research
  period: 2022 – 2023
  diagram: pipeline
  tags: [Python, PySpark, MapReduce, Amazon EMR, PyTorch]
  body: >-
    Distributed pipelines extracting opcode and control-flow features from
    Solidity bytecode, then training anomaly-detection models over the result.
    At that volume the extraction step, not the model, decides whether the
    experiment is runnable at all.
  metrics:
    - value: 65%
      label: improvement in analysis efficiency
    - value: 10M+
      label: transactions processed
