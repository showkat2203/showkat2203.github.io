# Citation figures, refreshed weekly from OpenAlex by `npm run scholar`
# (.github/workflows/scholar.yml runs it and commits only when a number moves).
#
# Not Google Scholar: it has no API, has never had one, and blocks automated
# access. OpenAlex is an open REST API built to be queried, so these numbers
# come from a source that consents to being read — and the page attributes them
# to OpenAlex rather than claiming a Scholar figure it never got from Scholar.
# OpenAlex indexes less than Scholar, so expect these to run lower.
#
# Everything else is still derived from publications.yaml: the paper count and
# the venue list come straight from it, so adding a paper updates every page.
#
# `perPublication` is a manual override. Fill it with a count per
# publications.yaml key and, once every paper has one, the total and h-index
# are computed from those instead of the aggregates below. Leave it empty to
# let the weekly sync drive the figures.
#
# `asOf` is set by the sync and printed beside the numbers, so a figure is
# never shown as though it were live.
main:
  asOf: '2026-09-12'
  totalCitations: 128
  hIndex: 6
  perPublication: {}
  source:
    name: OpenAlex
    # Pinned by the first sync, which resolves it from the DOIs in
    # publications.yaml and prints what it matched.
    id: A5092167079
    url: https://openalex.org/A5092167079
