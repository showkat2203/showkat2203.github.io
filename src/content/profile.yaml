# Single profile record. Edit freely; nothing here is referenced by name in
# components except the keys themselves.
main:
  name: Md Showkat Hossain Chy
  # Aliases that mark authorship in publication author lists. Any author string
  # matching one of these exactly is rendered in bold.
  selfAliases:
    - M. S. H. Chy
  role: Software engineer
  location: Seattle, Washington, USA
  locationShort: Seattle, Washington
  residency: U.S. Permanent Resident
  email: mdshowkathossainchy@gmail.com

  # The paragraph under the hero headline.
  positioning: >-
    Seven years on distributed systems and machine learning over large graphs,
    with earlier work on firmware running under fixed memory and power budgets.
    The common thread is correctness under concurrency, failure, and scale.

  # The hero headline. Kept short: it sets at display size over three lines.
  headline: Builds systems where correctness is the hard part.

  metaDescription: >-
    Md Showkat Hossain Chy builds systems where correctness under concurrency,
    failure, and scale is the hard part: MCU firmware under fixed memory and
    power budgets, distributed services that reconcile out-of-order events, and
    machine learning over graphs with millions of nodes. Twelve peer-reviewed
    publications, 148 citations.

  links:
    github:
      label: GitHub
      url: https://github.com/showkat2203
    # A null url renders the label with a visible "link pending" note rather
    # than a dead link.
    scholar:
      label: Google Scholar
      url: "https://scholar.google.com/citations?hl=en&user=Z9VUfzEAAAAJ"
    # PLACEHOLDER: replace url with the real LinkedIn profile URL.
    linkedin:
      label: LinkedIn
      url: null

  # How the CV is offered. `hosted` is the PDF committed in this repo and
  # generated by `npm run cv:pdf`; it always works and needs no third party.
  # `drive` and `latex` are optional extras — fill either in and an extra link
  # appears next to the download. PLACEHOLDER: both are null.
  cv:
    hosted: /cv.pdf
    drive: null
    latex: null

  record:
    publications: 12
    citations: 148
    hIndex: 8
    venues:
      - IEEE/ACM ASE
      - ECSA
      - CLOSER
      - Journal of Systems and Software
      - Cluster Computing
      - Electronics
      - Telecom
      - SeGAH
      - ICSEC
