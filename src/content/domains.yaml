# The three practice areas, shown as a short row near the top of the home page.
embedded:
  order: 3
  label: Embedded and firmware
  body: >-
    FreeRTOS firmware and device drivers in C and C++ over SPI, UART, and I2C.
    Bluetooth Low Energy and GATT control and data planes, rollback-safe
    over-the-air updates, and profiling under fixed memory and power budgets.

distributed:
  order: 1
  label: Distributed and cloud
  body: >-
    Event-driven services that reconcile dropped, duplicated, and out-of-order
    updates across regions. Graph and document data modelling, versioned APIs,
    and the observability needed to prove a consistency commitment.

graph-ml:
  order: 2
  label: Graph machine learning
  body: >-
    Graph neural networks and variational autoencoders over large dependency
    graphs, with clustering to recover latent structure, and reproducible
    benchmarks to measure the result against.
