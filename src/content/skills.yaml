# Technical range, written as prose rather than a tag cloud: no ratings, no
# bars, no logo grid.
languages:
  order: 1
  heading: Languages
  items: C, C++, Java, Python, TypeScript, JavaScript, SQL, Bash

embedded:
  order: 4
  heading: Embedded and low-level
  items: >-
    FreeRTOS, device drivers over SPI, UART, and I2C, Bluetooth Low Energy and
    GATT, JTAG and Trace32 profiling, memory- and power-constrained
    optimisation, rollback-safe over-the-air updates

distributed:
  order: 2
  heading: Distributed and cloud
  items: >-
    Event-driven architecture, MapReduce, PySpark, Amazon EMR, Kafka, Pulsar,
    Artemis, RocketMQ, DynamoDB, Amazon Neptune, PostgreSQL, Redis, Docker,
    Kubernetes, and AWS (Lambda, EventBridge, SQS, SNS, Batch, EC2, S3, IAM,
    CloudFormation, CDK)

ml:
  order: 3
  heading: Machine learning
  items: >-
    Graph neural networks, variational autoencoders, representation learning
    over graphs, clustering, anomaly detection, PyTorch, TensorFlow

practice:
  order: 5
  heading: Engineering practice
  items: >-
    JUnit, Cypress, integration and regression testing, coverage analysis,
    CI/CD, SonarQube, static analysis, Spring Boot, GraphQL, REST, Git, Perforce
