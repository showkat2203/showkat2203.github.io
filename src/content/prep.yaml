# The interview-prep offer. Everything the page says lives here, so the copy
# can change without touching the component.
#
# Booking runs on the page itself: Cal.com's calendar is embedded inline, so a
# visitor picks a session type, a date and a time, writes what they want out of
# it, and gets a confirmation and a calendar invite without leaving the site.
# Cal.com holds the availability and sends the mail, because doing that needs a
# server and this site is static.
#
# To switch it on, set `booking.calUser` to the Cal.com username. Give each
# format its own `calEvent` slug to offer them as separate session types, or set
# just `booking.calEvent` to run everything through one event type.
#
# While `calUser` is null there is nothing to embed, so the page falls back to
# the email address and loads no third-party script at all.
main:
  kicker: Free 30-minute sessions
  headline: Interview prep for big tech
  lede: >-
    One-to-one sessions for engineers working toward a loop at a large tech
    company: the coding rounds, the design round, and the behavioural round
    that decides more offers than candidates expect. Thirty minutes, no charge.

  metaDescription: >-
    Free 30-minute interview prep with an engineer who has worked through
    big-tech loops: mock coding and system design interviews, behavioural
    interview practice, and career advice for engineers targeting FAANG-style
    companies.

  sessionMinutes: 30

  # Who the session helps, stated plainly so nobody books the wrong thing.
  fitHeading: Who this is for
  fitFor:
    - Engineers with a loop already booked who want to rehearse under time
      pressure rather than read more advice.
    - Engineers a few months out who want a study order instead of a reading
      list, and an honest read on which round will fail them first.
    - Engineers switching from a smaller company or from research, where the
      format is unfamiliar even when the engineering is not.
  fitNot:
    - A referral. I do not have one to give, and a referral from a stranger is
      worth less than a prepared candidate.
    - Questions from any company's actual question bank. I would not pass those
      on if I had them.
    - A guarantee. Nobody can offer one, and an hour with me changes your
      preparation, not the committee.

  formatsHeading: What a session can be
  formatsNote: >-
    Pick one when you book. Thirty minutes is enough for one of these done
    properly, and not enough for two.
  formats:
    - order: 1
      title: Technical mock
      # Cal.com event slug for this format. Null falls back to booking.calEvent.
      calEvent: null
      body: >-
        A coding or system design problem run the way the round runs: you drive,
        I probe, and we stop with ten minutes left so the feedback is specific
        rather than general. You get the signal an interviewer would have
        written down.
    - order: 2
      title: Behavioural mock
      # Cal.com event slug for this format. Null falls back to booking.calEvent.
      calEvent: null
      body: >-
        Two or three questions of the kind that open a behavioural round, then a
        read on what your answers actually demonstrated. This is the round
        strong engineers most often lose, usually by describing a team's work
        instead of their own decisions.
    - order: 3
      title: Interview preparation
      # Cal.com event slug for this format. Null falls back to booking.calEvent.
      calEvent: null
      body: >-
        What to study and in what order, given the loop you are facing and the
        time you have left. Most candidates over-prepare algorithms and
        under-prepare design and behavioural, and the ratio is fixable.
    - order: 4
      title: Career advice
      # Cal.com event slug for this format. Null falls back to booking.calEvent.
      calEvent: null
      body: >-
        Whether to switch, what level to target, how an offer compares, or how a
        CV reads to the person screening it. Bring the decision you are stuck
        on.

  processHeading: How it works
  process:
    - order: 1
      title: Book a slot
      body: >-
        Pick a time and say which of the four you want, plus one or two lines of
        context: the company stage, the round, the date.
    - order: 2
      title: Send anything relevant first
      body: >-
        A CV, a job description, or the problem you fell over last time. Thirty
        minutes goes further when I have read something beforehand.
    - order: 3
      title: Thirty minutes, one to one
      body: >-
        Video call. Mocks run to the clock on purpose, because the time pressure
        is the part that is hard to practise alone.
    - order: 4
      title: Written notes afterwards
      body: >-
        A short summary of what I would work on next, so the session is
        something you can act on a week later.

  # Drawn from the same data as the rest of the site, so it cannot overstate.
  credibilityHeading: Where this comes from
  credibility: >-
    Seven years building distributed systems, cloud infrastructure, and embedded
    firmware, most recently as a Software Development Engineer at AWS, and
    earlier at Samsung Research. I have been on both sides of the table, built
    the contest platform the ICPC runs for more than fifty thousand students a
    year, and chaired programme committees for two international conferences.
  credibilityLink: The full record is on the CV

  bookingHeading: Book a session
  booking:
    # Cal.com username. Null means booking is not wired up yet.
    calUser: showkat
    # Event slug used by any format that does not name its own. `30min` is the
    # 30-minute event a new Cal.com account starts with; if the event has been
    # renamed, take the slug from the end of its booking URL. Give each format
    # its own slug above to offer them as four separate calendars instead.
    calEvent: 30min
    # Where the calendar is served from. Only change this for a self-hosted
    # Cal.com instance.
    origin: https://cal.com

    # Two sets of words, because a label must never promise something that is
    # not at the other end of it. `calendar` is used once calUser is set and
    # there is a calendar to pick from; `email` is used until then.
    calendar:
      cta: Pick a time
      # True whether or not the four formats are split into separate calendars:
      # with one shared event there is no chooser on the page, so the notes are
      # where the format gets named.
      lead: >-
        Thirty minutes, one to one, no charge. Choose a time below, and say in
        the notes which of the four you want and what you want out of it — the
        more specific, the better the thirty minutes goes.
      note: >-
        Sessions are free while I have the time for them. Times are shown in your
        own timezone, and you will get a confirmation and a calendar invite
        straight away.
    email:
      cta: Email me to arrange a time
      lead: >-
        Thirty minutes, one to one, no charge. Email me with which of the four
        you want and roughly where you are in the process, and we will find a
        slot that works.
      note: >-
        Sessions are free while I have the time for them. I answer within a day
        or two.
