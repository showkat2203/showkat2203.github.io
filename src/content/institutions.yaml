# Institutions, used for the credibility row and the experience timeline.
#
# Each entry renders a logo from public/img/logos/<key>.svg when one is there,
# and a monogram in the site's own typography when it is not.
#
# `logoSource` records where the SVG came from, so `npm run logos:fetch` can
# download and normalise all of them in one step and the provenance stays in
# the repo. Logos sit on a white tile in both themes, which is how brand marks
# are designed to be seen, so full-colour marks are kept as drawn.
#
# Only use marks you are entitled to use. Naming a past employer factually is
# ordinary; redistributing a logo for other purposes is not.
aws:
  order: 1
  name: Amazon Web Services
  short: AWS
  monogram: AWS
  featured: true
  logoSource: https://upload.wikimedia.org/wikipedia/commons/f/fc/Amazon_Web_Services_2025.svg

